<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator Nilai Mahasiswa</title>
</head>
<body>

  <h1>Kalkulator Nilai Mahasiswa</h1>

  <form id="formNilai">
    <label for="tugas">Nilai Tugas: </label>
    <input type="number" id="tugas" value="80"><br><br>

    <label for="uts">Nilai UTS: </label>
    <input type="number" id="uts" value="75"><br><br>

    <label for="uas">Nilai UAS: </label>
    <input type="number" id="uas" value="90"><br><br>

    <button type="button" onclick="prosesHitung()">Hitung Nilai</button>
    <button type="button" onclick="resetForm()">Reset</button>
  </form>

  <h2>Hasil Perhitungan</h2>

  <p>Nilai akhir: <span id="outNilai"></span></p>
  <p>Predikat: <span id="outPredikat"></span></p>
  <p>Status: <span id="outStatus"></span></p>

  <script src="script.js"></script>
</body>
</html>
